name: Alexandre Collet
headline: Co-fondateur & CTO chez Altergo — 17 ans à concevoir des solutions de gestion de l'énergie, du silicium au cloud
bio: "Co-fondateur & CTO, je conçois depuis 17 ans des technologies de gestion de batterie sur toute la chaîne, du silicium de l'électronique de puissance jusqu'à l'analyse cloud. Fondateur de Freemens (2011), puis co-fondateur d'ION Energy (2018) et d'Altergo (2021), j'ai fait grandir l'équipe d'ingénierie à plus de 100 personnes sur deux sites en Inde, concevant des BMS et ECU de niveau ASIL C (ISO 26262). J'ai ensuite développé une plateforme de jumeaux numériques pilotée par l'IA, dédiée à l'efficacité opérationnelle et à l'allongement de la durée de vie des systèmes de stockage d'énergie (ESS) à l'échelle du GWh."
achievements:
  - "**3 entreprises fondées** — Freemens (2011), ION Energy (2018) et Altergo (2021), du silicium au cloud."
  - "**Organisation de 70 ingénieurs** bâtie et dirigée entre la France et l'Inde, du matériel à la sûreté de fonctionnement."
  - "**Plus d'un million de BMS avancés vendus** dans plus de 15 pays, fabriqués à 100 % en Inde."
  - "**~700 MWh sous gestion** sur Altergo, ~15 % de durée de vie gagnée ; conseil sur le **projet 30 GWh d'Adani** à Khavda, en Inde (2025-2026)."
  - "**Pré-Série A de 3,6 M$** menée par le Climate Pledge Fund d'Amazon — son premier investissement hors des États-Unis."
  - "**Fournisseur BMS exclusif de Hero MotoCorp** — premier BMS deux-roues conforme ISO 26262 et AIS-156 en Inde."
location: France
languages: [en, fr]
